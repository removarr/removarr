name: image

# Builds the image for both architectures and smoke-tests it on every pull request and push to
# main. Only a published release pushes it to ghcr.io (spec section 11, releases).

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

# A newer run of the same pull request replaces the older one. A release run is never cancelled.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/removarr/removarr

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Check the compose example
        run: docker compose -f docker-compose.yml config --quiet
      - uses: docker/setup-buildx-action@v4

      - name: Build for the smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: removarr:smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
      - name: Smoke test
        run: scripts/smoke-image.sh removarr:smoke

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !github.event.release.prerelease }}
            type=semver,pattern={{major}},enable=${{ !github.event.release.prerelease }}
          flavor: |
            latest=${{ github.event_name == 'release' && !github.event.release.prerelease && !contains(github.ref_name, '-') }}
      - if: github.event_name == 'release'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both architectures, and push for a release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'release' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=multiarch
            type=gha,scope=smoke
          cache-to: type=gha,scope=multiarch,mode=max
